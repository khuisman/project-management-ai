services:
  mcp-atlassian:
    image: ghcr.io/sooperset/mcp-atlassian:latest
    container_name: mcp-atlassian
    env_file:
      - .env
    ports:
      - "${JIRA_MCP_SERVER_PORT:-8010}:8000"
    networks:
      - mcp-network
    command: ["--transport=streamable-http"]

  # mcp-google:
