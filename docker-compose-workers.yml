  slackbot:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: slackbot
    #entrypoint: ["tail", "-f", "/dev/null"]
    env_file:
      - .env
    volumes:
      - .:/serve
    #   - TOOLS=gmail drive calendar
    ports:
      - "3001:3000"
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
